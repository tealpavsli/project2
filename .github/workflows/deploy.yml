name: Deploy Blazor to GitHub Pages

on:
  push:
    branches: [ main, test ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout test
        uses: actions/checkout@v4
        with:
          ref: test
          path: test-src

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish main
        run: dotnet publish main-src/project2/project2.csproj -c Release -o release-main

      - name: Publish test
        run: dotnet publish test-src/project2/project2.csproj -c Release -o release-test

      - name: Fix base href for main
        run: sed -i 's#<base href="/" />#<base href="/project2/" />#' release-main/wwwroot/index.html

      - name: Fix base href for test preview
        run: sed -i 's#<base href="/" />#<base href="/project2/test-preview/" />#' release-test/wwwroot/index.html

      - name: Assemble combined site
        run: |
          mkdir -p combined
          cp -r release-main/wwwroot/. combined/
          mkdir -p combined/test-preview
          cp -r release-test/wwwroot/. combined/test-preview/

      - name: Add .nojekyll
        run: touch combined/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4